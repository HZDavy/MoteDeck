<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="pathTitle pathDesc">
  <title id="pathTitle">语音通路：遥控器话筒、MoteDeck 输出端点、输入法麦克风、当前输入框</title>
  <desc id="pathDesc">四段式示意图。遥控器话筒的声音进入 MoteDeck 选定的 CABLE Input 输出端点，输入法从 CABLE Output 读取麦克风，识别出的文字落进当前输入框。</desc>

  <rect width="1200" height="320" rx="28" fill="#EEEDEA"/>

  <text x="64" y="64" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="2" fill="#6B6A66">语音通路 · 四段</text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <g id="stage-1">
      <rect x="64" y="104" width="232" height="108" rx="16" fill="#FFFFFF" stroke="#DCDAD5" stroke-width="1.5"/>
      <text x="88" y="146" font-size="22" font-weight="700" fill="#111111">遥控器话筒</text>
      <text x="88" y="184" font-size="18" fill="#8A8883">按住语音键说话</text>
    </g>

    <g id="stage-2">
      <rect x="344" y="104" width="232" height="108" rx="16" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
      <text x="368" y="146" font-size="22" font-weight="700" fill="#111111">输出端点</text>
      <rect x="366" y="160" width="152" height="36" rx="10" fill="#111111"/>
      <text x="442" y="184" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#FFFFFF">CABLE Input</text>
    </g>

    <g id="stage-3">
      <rect x="624" y="104" width="232" height="108" rx="16" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
      <text x="648" y="146" font-size="22" font-weight="700" fill="#111111">输入法麦克风</text>
      <rect x="646" y="160" width="160" height="36" rx="10" fill="#111111"/>
      <text x="726" y="184" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#FFFFFF">CABLE Output</text>
    </g>

    <g id="stage-4">
      <rect x="904" y="104" width="232" height="108" rx="16" fill="#FFFFFF" stroke="#DCDAD5" stroke-width="1.5"/>
      <text x="928" y="146" font-size="22" font-weight="700" fill="#111111">当前输入框</text>
      <text x="928" y="184" font-size="18" fill="#8A8883">文字落到光标处</text>
    </g>

    <text x="64" y="256" font-size="20" fill="#3A3936">CABLE Input 是 MoteDeck 写入声音的一侧，CABLE Output 是输入法读取麦克风的一侧。</text>
    <text x="64" y="286" font-size="20" fill="#8A8883">两边不要选反：写进去的一端在「输出端点」，读出来的一端在输入法的麦克风设置里。</text>
  </g>

  <g fill="none" stroke="#B4B2AC" stroke-width="2" stroke-linecap="round">
    <path d="M304 158 H328"/>
    <path d="M584 158 H608"/>
    <path d="M864 158 H888"/>
  </g>
  <g fill="#111111">
    <path d="M328 151 L340 158 L328 165 Z"/>
    <path d="M608 151 L620 158 L608 165 Z"/>
    <path d="M888 151 L900 158 L888 165 Z"/>
  </g>
</svg>
