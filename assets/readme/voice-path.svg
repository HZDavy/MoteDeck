<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="pathTitle pathDesc">
  <title id="pathTitle">语音通路：遥控器话筒、MoteDeck 输出端点、输入法麦克风、当前输入框</title>
  <desc id="pathDesc">四段式示意图。遥控器话筒的声音进入 MoteDeck 选定的 CABLE Input 输出端点，输入法从 CABLE Output 读取麦克风，识别出的文字落进当前输入框。</desc>

  <rect width="1200" height="320" rx="28" fill="#0B0F15"/>

  <text x="64" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="2" fill="#8C9AAB">语音通路 · 四段</text>

  <g id="stage-1">
    <rect x="64" y="112" width="232" height="100" rx="16" fill="#141A22" stroke="#232C38" stroke-width="1.5"/>
    <text x="88" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="600" fill="#E6EDF6">遥控器话筒</text>
    <text x="88" y="186" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#8C9AAB">按住语音键说话</text>
  </g>

  <g id="stage-2">
    <rect x="344" y="112" width="232" height="100" rx="16" fill="#141A22" stroke="#2E4A6B" stroke-width="1.5"/>
    <text x="368" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="600" fill="#E6EDF6">输出端点</text>
    <text x="368" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#7FB4FF">CABLE Input</text>
  </g>

  <g id="stage-3">
    <rect x="624" y="112" width="232" height="100" rx="16" fill="#141A22" stroke="#2E4A6B" stroke-width="1.5"/>
    <text x="648" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="600" fill="#E6EDF6">输入法麦克风</text>
    <text x="648" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#7FB4FF">CABLE Output</text>
  </g>

  <g id="stage-4">
    <rect x="904" y="112" width="232" height="100" rx="16" fill="#141A22" stroke="#232C38" stroke-width="1.5"/>
    <text x="928" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="600" fill="#E6EDF6">当前输入框</text>
    <text x="928" y="186" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#8C9AAB">文字落到光标处</text>
  </g>

  <g fill="none" stroke="#4A5A70" stroke-width="2" stroke-linecap="round">
    <path d="M304 162 H328"/>
    <path d="M584 162 H608"/>
    <path d="M864 162 H888"/>
  </g>
  <g fill="#4A5A70">
    <path d="M328 155 L340 162 L328 169 Z"/>
    <path d="M608 155 L620 162 L608 169 Z"/>
    <path d="M888 155 L900 162 L888 169 Z"/>
  </g>

  <text x="64" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#CBD5E1">CABLE Input 是 MoteDeck 写入声音的一侧，CABLE Output 是输入法读取麦克风的一侧。</text>
  <text x="64" y="282" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#77869A">两边不要选反：写进去的一端在「输出端点」，读出来的一端在输入法的麦克风设置里。</text>
</svg>
