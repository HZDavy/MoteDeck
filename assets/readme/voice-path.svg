  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <g id="stage-1">
      <rect x="64" y="104" width="232" height="108" rx="16" fill="#FFFFFF" stroke="#DCDAD5" stroke-width="1.5"/>
      <text x="88" y="146" font-size="22" font-weight="700" fill="#111111">遥控器话筒</text>
      <text x="88" y="184" font-size="18" fill="#8A8883">按住语音键说话</text>
    </g>

    <g id="stage-2">
      <rect x="344" y="104" width="232" height="108" rx="16" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
