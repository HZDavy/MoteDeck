<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">MoteDeck：把小米蓝牙语音遥控器 2 Pro 变成 Windows 的快捷键和麦克风</title>
  <desc id="heroDesc">浅色标题板，右侧为插画风格的小米蓝牙语音遥控器 2 Pro：圆角机身、深色方向环、侧边按键与音量拨键，话筒键旁有三道声波弧线，背后是一枚浅色圆盘与虚线圆环。左侧是项目图标、名称、一句话说明和三个特性标签：本机运行、不上传录音、Win 10/11 x64。</desc>

  <defs>
    <linearGradient id="glassBody" x1="3.2" y1="0.8" x2="21" y2="23.2" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#39424F"/>
      <stop offset="0.36" stop-color="#1B212A"/>
      <stop offset="0.74" stop-color="#0B0F15"/>
      <stop offset="1" stop-color="#05080B"/>
    </linearGradient>
    <radialGradient id="glassSheen" cx="6.2" cy="3" r="15.8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.52" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pillBody" x1="9" y1="4.2" x2="15" y2="17.6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.46" stop-color="#F3F7FC"/>
      <stop offset="1" stop-color="#D7E1EE"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" rx="28" fill="#EEEDEA"/>

  <!-- 右侧插画：底圆、虚线环、遥控器 -->
  <g id="illustration">
    <circle cx="888" cy="210" r="162" fill="#E4E0D8"/>
    <circle cx="888" cy="210" r="186" fill="none" stroke="#DBD6CD" stroke-width="1.6" stroke-dasharray="2 11" stroke-linecap="round"/>
    <ellipse cx="888" cy="364" rx="60" ry="7" fill="#191919" opacity="0.07"/>

    <g transform="translate(888 208) rotate(-8) scale(1.06)">
      <!-- 机身 -->
      <rect x="-52" y="-142" width="104" height="276" rx="34" fill="#FCFBF8" stroke="#191919" stroke-width="3"/>

      <!-- 电源 / 话筒 -->
      <circle cx="-26" cy="-112" r="13" fill="#191919"/>
      <g stroke="#FAF8F3" stroke-width="2" fill="none" stroke-linecap="round">
        <path d="M-31.2 -115.2 A6 6 0 1 0 -20.8 -115.2"/>
        <path d="M-26 -119.4 V-112"/>
      </g>
      <circle cx="26" cy="-112" r="13" fill="#191919"/>
      <g fill="none" stroke="#FAF8F3" stroke-width="2" stroke-linecap="round">
        <rect x="23.5" y="-115.6" width="5" height="8.6" rx="2.5" fill="#FAF8F3" stroke="none"/>
        <path d="M21.8 -111.6 A5.4 5.4 0 0 0 30.2 -111.6"/>
        <path d="M26 -105.6 V-103.4"/>
      </g>

      <!-- 话筒声波 -->
      <g fill="none" stroke="#191919" stroke-linecap="round">
        <path d="M28.4 -139.9 A28 28 0 0 1 53.4 -117.8" stroke-width="3" opacity="0.95"/>
        <path d="M29.5 -151.8 A40 40 0 0 1 65.1 -120.3" stroke-width="3" opacity="0.62"/>
        <path d="M30.5 -163.8 A52 52 0 0 1 76.9 -122.8" stroke-width="3" opacity="0.34"/>
      </g>

      <!-- 方向环 -->
      <circle cx="0" cy="-56" r="41" fill="#191919"/>
      <circle cx="0" cy="-56" r="13" fill="#FCFBF8"/>

      <!-- 左侧按键 -->
      <g fill="#191919">
        <circle cx="-34" cy="4" r="12"/>
        <circle cx="-34" cy="34" r="12"/>
        <circle cx="-34" cy="64" r="12"/>
      </g>
      <g fill="none" stroke="#FAF8F3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-37.5 3.4 L-33.6 8 L-37.5 12.6"/>
        <path d="M-39 35.6 L-34 31.4 L-29 35.6 V40.6 H-39 Z"/>
        <path d="M-39 61.6 H-29 M-39 65.6 H-29 M-39 69.6 H-29"/>
      </g>

      <!-- 音量拨键 -->
      <rect x="20" y="-2" width="28" height="64" rx="14" fill="#191919"/>
      <g fill="none" stroke="#FAF8F3" stroke-width="2" stroke-linecap="round">
        <path d="M26 14 H42 M34 6 V22"/>
        <path d="M26 40 H42"/>
      </g>

      <!-- TV 键 -->
      <circle cx="34" cy="92" r="12" fill="#191919"/>
      <rect x="28" y="87.5" width="12" height="9" rx="2" fill="none" stroke="#FAF8F3" stroke-width="2"/>
    </g>
  </g>

  <g id="identity" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <g transform="translate(64 60) scale(2)">
      <rect width="24" height="24" rx="5.4" fill="url(#glassBody)"/>
      <rect width="24" height="24" rx="5.4" fill="url(#glassSheen)"/>
      <g transform="rotate(45 12 12)">
        <path fill="url(#pillBody)" fill-rule="evenodd" d="M12 4.125A3.375 3.375 0 0 1 15.375 7.5V16.5A3.375 3.375 0 0 1 8.625 16.5V7.5A3.375 3.375 0 0 1 12 4.125ZM12 6.9375A1.6875 1.6875 0 1 1 12 10.3125A1.6875 1.6875 0 1 1 12 6.9375Z"/>
      </g>
    </g>
    <text x="128" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="2" fill="#6B6A66">WINDOWS · RC003</text>

