<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d">
  <title id="t">MoteDeck 原生支持 Vokie</title>
  <desc id="d">Vokie 原生支持外接语音设备，MoteDeck 按它的插件协议做了适配：遥控器话筒的声音经本机回环交给插件，再由插件推进 Vokie 会话，整理好的文字落进当前输入框。</desc>
  <defs>
    <linearGradient id="glassBody" x1="3.2" y1="0.8" x2="21" y2="23.2" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#39424F"/>
      <stop offset="0.36" stop-color="#1B212A"/>
      <stop offset="0.74" stop-color="#0B0F15"/>
      <stop offset="1" stop-color="#05080B"/>
    </linearGradient>
    <radialGradient id="glassSheen" cx="6.2" cy="3" r="15.8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.52" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glassFloor" cx="12" cy="23.8" r="12.2" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pillBody" x1="9" y1="4.2" x2="15" y2="17.6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.46" stop-color="#F3F7FC"/>
      <stop offset="1" stop-color="#D7E1EE"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="18" fill="#EEEDEA"/>

